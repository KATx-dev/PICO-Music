name: PICO Music Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  test-and-lint:
    name: Unit Tests & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run F-Droid Debug Unit Tests
        run: ./gradlew testFdroidDebugUnitTest --no-daemon --console=plain --stacktrace

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testFdroidDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 7

      - name: Run Lint (F-Droid Debug)
        run: ./gradlew lintFdroidDebug --no-daemon --console=plain --stacktrace

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: lint-reports
          path: app/build/reports/lint-results-fdroidDebug.*
          if-no-files-found: ignore
          retention-days: 7

  build-apk:
    name: Build PICO Music APK
    runs-on: ubuntu-latest
    needs: test-and-lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create optional private.properties
        env:
          PRIVATE_PROPERTIES: ${{ secrets.PRIVATE_PROPERTIES }}
        run: |
          if [ -n "$PRIVATE_PROPERTIES" ]; then
            printf '%s' "$PRIVATE_PROPERTIES" | base64 -di > ./private.properties
          else
            touch ./private.properties
          fi

      - name: Assemble F-Droid Debug APK
        env:
          APPLE_MUSIC_FALLBACK_TOKEN: ${{ secrets.APPLE_MUSIC_FALLBACK_TOKEN }}
        run: ./gradlew assembleFdroidDebug --no-daemon --console=plain --stacktrace

      - name: Upload PICO Music APK
        uses: actions/upload-artifact@v5
        with:
          name: pico-music-fdroid-debug-apk
          path: app/build/outputs/apk/fdroid/debug/*.apk
          retention-days: 14
